<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup</title>
    {%load static%}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <h2>Signup</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}"><button type="button">Login</button></a></p>
</body>
</html>
